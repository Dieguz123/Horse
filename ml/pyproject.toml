[project]
name = "horse-ml"
version = "0.1.0"
description = "Horse ML: learning defensive positioning (ghosting) from football tracking data"
readme = "README.md"
authors = [
    { name = "Diego", email = "diegomarchesini6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "kloppy>=3.19.1",
    "matplotlib>=3.11.2",
    "mplsoccer>=1.8.1",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
